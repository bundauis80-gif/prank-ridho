<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Check</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(700px,95vw);background:#101010;border:1px solid #444;border-radius:16px;padding:24px;text-align:center;box-shadow:0 0 30px #000}
h1{font-size:clamp(28px,7vw,48px);margin:0 0 12px}
p{color:#ccc}
video{display:none;width:100%;max-height:55vh;background:#000;border-radius:12px;margin-top:18px}
button{border:0;border-radius:10px;padding:14px 22px;font-size:17px;font-weight:bold;cursor:pointer;margin:8px}
#start{background:#00e676;color:#001b0a}
#stop{background:#fff;color:#111;display:none}
#status{margin-top:14px;color:#8cffb0}
#reveal{display:none}
.big{font-size:clamp(34px,9vw,70px);font-weight:900;color:#00ff66;line-height:1.05}
.small{font-size:14px;color:#aaa}
</style>
</head>
<body>
<div class="card">
  <div id="setup">
    <h1>📷 CAMERA CHECK</h1>
    <p>Tekan tombol di bawah jika kamu setuju menampilkan kamera di halaman ini.</p>
    <button id="start">AKTIFKAN KAMERA</button>
    <div id="status"></div>
    <p class="small">Kamera hanya ditampilkan di perangkat ini. Tidak ada foto/video yang diambil, dikirim, atau disimpan oleh halaman ini.</p>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <div id="reveal">
    <div class="big">😂 BOY AWAS ADA RIDHO</div>
    <p>PRANK! Kameramu aman 😎</p>
    <button id="again">ULANGI</button>
  </div>
</div>

<script>
const start=document.getElementById("start");
const stop=document.getElementById("stop");
const video=document.getElementById("video");
const status=document.getElementById("status");
const setup=document.getElementById("setup");
const reveal=document.getElementById("reveal");
const again=document.getElementById("again");
let stream=null;

async function startCamera(){
  status.textContent="Meminta izin kamera...";
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user"},
      audio:false
    });
    video.srcObject=stream;
    video.style.display="block";
    start.style.display="none";
    status.textContent="Kamera aktif. Tunggu...";
    setTimeout(()=>{
      stopCamera();
      setup.style.display="none";
      video.style.display="none";
      reveal.style.display="block";
    },5000);
  }catch(e){
    status.textContent="Kamera tidak diaktifkan. Izin diperlukan untuk menjalankan prank.";
  }
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }
}

start.addEventListener("click",startCamera);
again.addEventListener("click",()=>{
  reveal.style.display="none";
  setup.style.display="block";
  start.style.display="inline-block";
  status.textContent="";
});
window.addEventListener("beforeunload",stopCamera);
</script>
</body>
</html>
