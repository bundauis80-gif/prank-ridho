<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Alert</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#00ff66;font-family:monospace;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.screen{width:92%;max-width:600px;text-align:center}
.warning{color:#ff3030;font-size:clamp(32px,8vw,60px);font-weight:bold;animation:blink .7s infinite}
.alert{color:white;font-size:20px;margin:20px 0}
.box{border:2px solid #00ff66;padding:25px;background:#081108;box-shadow:0 0 25px #00ff66}
.progress{width:100%;height:25px;border:2px solid #00ff66;margin-top:25px}
.bar{width:0%;height:100%;background:#00ff66;transition:width .2s}
.percent{font-size:24px;margin-top:10px}
.fake{margin-top:20px;color:#ff5555;font-size:14px}
#prank{display:none}
.prank-title{color:#00ff66;font-size:clamp(45px,12vw,90px);font-weight:bold}
button{margin-top:25px;padding:14px 30px;border:none;border-radius:8px;background:#00ff66;color:#000;font-size:18px;font-weight:bold;cursor:pointer}
@keyframes blink{50%{opacity:.3}}
.shake{animation:shake .08s infinite}
@keyframes shake{0%{transform:translate(2px,1px)}25%{transform:translate(-2px,-1px)}50%{transform:translate(1px,-2px)}75%{transform:translate(-1px,2px)}100%{transform:translate(2px,-1px)}}
</style>
</head>
<body>
<div class="screen">
<div id="loading">
<div class="warning">⚠ SYSTEM ALERT ⚠</div>
<div class="box">
<div class="alert">Ancaman keamanan terdeteksi!</div>
<p>Sistem sedang melakukan pemeriksaan keamanan...</p>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="percent" id="percent">0%</div>
<div class="fake" id="fake">Scanning system files...</div>
</div>
</div>
<div id="prank">
<div class="prank-title">😂 BOY AWAS ADA RIDHO</div>
<div class="alert">HP kamu sebenarnya aman.</div>
<p>Tenang bro, ini cuma website prank 🤣</p>
<button onclick="location.reload()">ULANGI</button>
</div>
</div>
<script>
let progress=0;
const bar=document.getElementById("bar");
const percent=document.getElementById("percent");
const loading=document.getElementById("loading");
const prank=document.getElementById("prank");
const fake=document.getElementById("fake");
const messages=[
"Scanning system files...",
"Checking applications...",
"Analyzing security...",
"Checking suspicious files...",
"Almost finished..."
];
let i=0;
const timer=setInterval(()=>{
 progress++;
 bar.style.width=progress+"%";
 percent.textContent=progress+"%";
 if(progress%20===0){
   i=Math.min(i+1,messages.length-1);
   fake.textContent=messages[i];
 }
 if(progress>=70) document.body.classList.add("shake");
 if(progress>=100){
   clearInterval(timer);
   setTimeout(()=>{
     document.body.classList.remove("shake");
     loading.style.display="none";
     prank.style.display="block";
   },1200);
 }
},70);
</script>
</body>
</html>
